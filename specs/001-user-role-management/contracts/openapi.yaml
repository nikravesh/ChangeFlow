openapi: 3.1.0
info:
  title: ChangeFlow User Provisioning Contract
  version: 1.0.0
  description: Contract for creating a user, credential, and initial roles through the approved anonymous bootstrap flow.
paths:
  /users:
    post:
      operationId: createUser
      summary: Create a user with initial roles
      description: >-
        Creates the user, password credential, and all requested role assignments atomically.
        The reusable setup credential is supplied through the Authorization header and remains
        valid until manually rotated.
      security:
        - SetupCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User, credential, and initial roles were created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: One or more request fields violate the approved validation rules.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The setup credential is missing or invalid. Both cases return the same public response.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Setup
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The normalized login identifier already exists, including a concurrent-create conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected failure occurred. Internal exception details are not exposed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    SetupCode:
      type: http
      scheme: setup
      description: >-
        Send `Authorization: Setup <code>`. The header value is sensitive and must not be logged,
        traced, persisted, or returned.
  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - loginIdentifier
        - password
        - roles
      properties:
        displayName:
          type: string
          minLength: 1
          description: Leading and trailing whitespace is ignored; the resulting value must not be empty.
        loginIdentifier:
          type: string
          minLength: 1
          description: >-
            Leading and trailing whitespace is ignored. Uniqueness is case-insensitive and enforced
            against the canonical form.
        password:
          type: string
          minLength: 8
          writeOnly: true
          description: >-
            Must contain at least one uppercase letter, one lowercase letter, one number, and one symbol.
            Its value is never returned or logged.
        roles:
          type: array
          minItems: 1
          description: Duplicate values are accepted and normalized to one assignment per role.
          items:
            $ref: '#/components/schemas/UserRole'
    CreateUserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - loginIdentifier
        - roles
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        loginIdentifier:
          type: string
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
    UserRole:
      type: string
      enum:
        - Requester
        - Reviewer
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code.
        traceId:
          type: string
          description: Correlation identifier safe to provide to support.
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: >-
                Field-level messages. Password failures identify violated rules but never echo the password.
